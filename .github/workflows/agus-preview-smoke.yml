name: AGUS private Codespaces preview smoke
on:
  push:
    branches:
      - preview/agus-v1-2-codespaces-20261020
permissions:
  contents: read
  statuses: write
concurrency:
  group: agus-preview-smoke
  cancel-in-progress: false
jobs:
  preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Report pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending -f context="agus/private-preview-bootstrap" \
            -f description="Checking safe Codespaces startup" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source is original validated candidate
        run: |
          git merge-base --is-ancestor 5fc0eac18b8120eaa3457f855d4f153c4264350e HEAD
          test "$(git diff --name-only 5fc0eac18b8120eaa3457f855d4f153c4264350e HEAD | grep -vc -e '^\.devcontainer/' -e '^\.github/workflows/agus-preview-smoke.yml$' || true)" = 0
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install packages
        run: npm ci --no-audit --no-fund
      - name: Check startup scripts
        run: |
          bash -n .devcontainer/start-preview.sh
          bash -n .devcontainer/configure-gemini.sh
      - name: Start fixture-only AGUS preview
        run: bash .devcontainer/start-preview.sh
      - name: Verify private defaults and HTTP readiness
        shell: bash
        run: |
          set -euo pipefail
          test -s .data/preview-login.txt
          grep -qx 'PAYMENT_MODE=fixture' .env.local
          grep -qx 'FINANCIAL_DEMO_ENABLED=true' .env.local
          grep -qx 'LIVE_TRANSFERS_ENABLED=false' .env.local
          grep -qx 'PAYSTACK_TRANSFERS_ENABLED=false' .env.local
          grep -qx 'AI_PROVIDER=none' .env.local
          ok=0
          for i in $(seq 1 70); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:3000/ || true)"
            if [[ "$status" =~ ^(200|301|302|303|307|308)$ ]]; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "::error::Next.js preview did not serve a page; sanitized log tail follows"
            tail -60 .data/preview.log
            exit 1
          fi
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "PASS: isolated fixture preview booted, private login generated, HTTP responsive. No model or provider calls."
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description="Codespaces preview bootstrap passed";
          else state=failure; description="Codespaces preview bootstrap needs repair"; fi
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" -f context="agus/private-preview-bootstrap" \
            -f description="$description" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
