name: AGUS v1.2 isolated fixture validation

on:
  push:
    branches:
      - validation/agus-v1-2-fixture-ci-20261019

permissions:
  contents: read

concurrency:
  group: agus-v1-2-fixture-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: test
      PAYMENT_MODE: fixture
      FINANCIAL_DEMO_ENABLED: "true"
      AI_PROVIDER: none
      AI_API_KEY: ""
      PAYSTACK_SECRET_KEY: ""
      PAYSTACK_TRANSFERS_ENABLED: "false"
      LIVE_TRANSFERS_ENABLED: "false"
      LIVE_OWNER_AUTHORIZED: "false"
      LIVE_WEBHOOK_VALIDATED: "false"
      LIVE_RECONCILIATION_VALIDATED: "false"
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: pglite://.data/agus-validation
    steps:
      - name: Checkout consolidated candidate
        uses: actions/checkout@v4
      - name: Verify exact parent commit
        shell: bash
        run: |
          git merge-base --is-ancestor eb38071ee8267d1800f043543f9f994879e10b94 HEAD
          echo "Isolated validation of AGUS v1.2 candidate eb38071"
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Full test suite
        run: npm test
      - name: Focused integration regressions
        run: npm run test:integration
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build
      - name: Install isolated browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Browser chat-payment and voice journeys
        env:
          NODE_ENV: production
        run: npm run test:browser
      - name: Integrated browser journeys
        env:
          NODE_ENV: production
        run: npm run test:browser:integration
      - name: HTTP smoke
        env:
          NODE_ENV: production
        run: npm run test:http
      - name: Report scope
        if: always()
        shell: bash
        run: |
          {
            echo "## AGUS v1.2 isolated validation"
            echo "Runs on a temporary branch derived from eb38071ee8267d1800f043543f9f994879e10b94."
            echo "Fixture financial records only; AI disabled; no provider secrets; live transfers disabled."
            echo "No deployment, no integration into main, and no genuine model/provider/device verification."
          } >> "$GITHUB_STEP_SUMMARY"
